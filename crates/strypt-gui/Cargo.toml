[package]
name = "strypt-gui"
description = "Desktop front-end for strypt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
publish = false

[[bin]]
name = "strypt-gui"
path = "src/main.rs"

[dependencies]
strypt-core = { path = "../strypt-core", version = "0.1.2" }
strypt-mark = { path = "../strypt-mark", version = "0.1.2" }
# ADR-0058. `links` stays off: it pulls `webbrowser` and `url`. AccessKit is on, and is why
# check-no-network.sh admits the AT-SPI crates for this crate alone.
eframe = { version = "0.36.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wayland",
    "x11",
    "wgpu",
] }
# ADR-0059: the Open files button. Adds `rfd` and a second, older `pollster` to the graph.
rfd = "0.17.2"

# ADR-0062: the .exe's Explorer icon. `cfg(windows)` here is the host, which runs rc.exe.
[target.'cfg(windows)'.build-dependencies]
strypt-mark = { path = "../strypt-mark", version = "0.1.2" }
winresource = { version = "0.1.31", default-features = false }

# ADR-0059: eframe's own winit, named only to choose X11, where file drops work.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.13", default-features = false }

[lints]
workspace = true
