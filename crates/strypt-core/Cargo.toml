[package]
name = "strypt-core"
description = "Detection and removal of hidden identifying metadata from files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Typed errors. `anyhow` must never appear here: callers have to distinguish "unsupported
# format" from "corrupt file" from "I/O error", and a boxed error erases exactly that
# (ADR-0008, ADR-0018).
thiserror = { workspace = true }
# PDF object model. See ADR-0018 for the evaluation against `oxidize-pdf` and for the
# honest accounting of what this dependency costs in transitive surface.
lopdf = { workspace = true }

# Lints are specified explicitly here rather than inherited, because Cargo does not permit a
# crate to both inherit `workspace.lints` and override them. The workspace set is repeated
# below, plus the panic-freedom lints that apply to this crate only.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# Panic-freedom in the parsing path (ADR-0006). These are denied here and NOT in strypt-cli,
# because the boundary that matters is "code reachable from untrusted bytes". Scope any
# necessary exception to the specific site with a comment explaining why it cannot be
# reached by hostile input — never blanket-allow at crate level, which defeats the purpose.
[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
