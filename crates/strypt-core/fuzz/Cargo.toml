[package]
name = "strypt-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# `fuzzing` opens the hidden entry point the ZIP target needs (ADR-0028). It is a non-default
# feature and is enabled here and nowhere else.
strypt-core = { path = "..", features = ["fuzzing"] }

[[bin]]
name = "pdf"
path = "fuzz_targets/pdf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jpeg"
path = "fuzz_targets/jpeg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "png"
path = "fuzz_targets/png.rs"
test = false
doc = false
bench = false

[[bin]]
name = "webp"
path = "fuzz_targets/webp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tiff"
path = "fuzz_targets/tiff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ooxml"
path = "fuzz_targets/ooxml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "odf"
path = "fuzz_targets/odf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zip"
path = "fuzz_targets/zip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "detect"
path = "fuzz_targets/detect.rs"
test = false
doc = false
bench = false

# Fuzz targets are their own workspace: they need nightly and a different profile from the
# crates under test, and folding them into the main workspace would drag libfuzzer into every
# ordinary `cargo build`.
[workspace]
members = ["."]

[profile.release]
debug = true
