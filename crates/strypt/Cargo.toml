[package]
name = "strypt"
description = "Strip hidden identifying metadata from files so they are safer to share"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "multimedia::images"]
# The tests read fixtures from the workspace's `corpus/`, which is not packaged.
exclude = ["tests/"]

[[bin]]
name = "strypt"
path = "src/main.rs"

[dependencies]
# `version` is required alongside `path`: a bare path dependency is a wildcard
# (deny.toml `wildcards = "deny"`) and cannot be published to crates.io. Bump it in step with
# the workspace version — a mismatch is only caught at publish time, not by `cargo test`.
strypt-core = { path = "../strypt-core", version = "0.2.0" }
clap = { workspace = true }
# JSON output. Hand-rolling a serialiser to save a dependency would mean hand-rolling string
# escaping, and a metadata value is precisely the kind of attacker-influenced text that finds
# the bugs in a hand-rolled escaper (ADR-0018).
serde_json = { workspace = true }

[lints]
workspace = true
