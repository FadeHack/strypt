[package]
name = "strypt-cli"
description = "Strip hidden identifying metadata from files so they are safer to share"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "strypt"
path = "src/main.rs"

[dependencies]
# `version` is required alongside `path`: a bare path dependency is a wildcard
# (deny.toml `wildcards = "deny"`) and cannot be published to crates.io in Phase 4.
strypt-core = { path = "../strypt-core", version = "0.0.0" }
# CLI dependencies (clap, etc.) arrive in Phase 1. See docs/ARCHITECTURE.md §4.

[lints]
workspace = true
