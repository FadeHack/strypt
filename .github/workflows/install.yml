name: install

# Runs README's install steps, read from README at this commit, on fresh runners (ADR-0049 item 10).
# Linux runs in a bare debian:13 container; the macOS and Windows images come with Homebrew and gh.
on: workflow_dispatch

permissions:
  contents: read
  attestations: read

env:
  README: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/README.md
  BUILT_FROM: 14b8af59e5405681a4581048da3786f13e68ddf7 # v0.1.1

jobs:
  brew-macos:
    name: brew (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [macos-15, macos-15-intel] }
    steps:
      - run: |
          brew --version
          curl -fsSL "$README" | grep '^brew install ' > steps.sh
          cat steps.sh && sh -ex steps.sh
          strypt --version && brew test fadehack/strypt/strypt

  brew-linux:
    name: brew (debian:13 on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    container: debian:13
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-24.04, ubuntu-24.04-arm] }
    steps:
      # Homebrew's documented prerequisites, and a user: its installer refuses root.
      - run: |
          apt-get update -qq && apt-get install -y -qq build-essential procps curl file git sudo >/dev/null
          useradd -m u && echo 'u ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/u
      - run: su u -c 'NONINTERACTIVE=1 bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'
      - run: |
          curl -fsSL "$README" | grep '^brew install ' > /tmp/steps.sh && chmod 644 /tmp/steps.sh
          su - u -c 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)" && brew --version && cat /tmp/steps.sh &&
            sh -ex /tmp/steps.sh && strypt --version && brew test fadehack/strypt/strypt'

  curl-macos:
    name: curl (${{ matrix.file }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, file: strypt-0.1.1-aarch64-apple-darwin }
          - { os: macos-15-intel, file: strypt-0.1.1-x86_64-apple-darwin }
    env: { FILE: "${{ matrix.file }}" }
    steps:
      - name: README's download block, with F set from its table
        run: |
          curl -fsSL "$README" -o README.md
          sed -n '/^F=strypt-/,/^```/p' README.md | sed '$d' | sed "1s/^F=[^ ]*/F=$FILE/" > steps.sh
          cat steps.sh && sh -ex steps.sh
      - name: README's gh line, signed out, then with a token
        if: always()
        env: { TOKEN: "${{ github.token }}" }
        run: |
          { echo "F=$FILE"; grep -o 'gh attestation verify [^`]*' README.md; } > gh.sh && cat gh.sh
          if sh gh.sh; then echo "signed out: passed"; else echo "signed out: failed"; fi
          GH_TOKEN=$TOKEN sh -e gh.sh
          # Silent on success without a terminal, so print what it verified.
          d=$(GH_TOKEN=$TOKEN gh attestation verify "$FILE" -R FadeHack/strypt --format json --jq '.[].verificationResult.signature.certificate.sourceRepositoryDigest')
          echo "built from $d" && [ "$d" = "$BUILT_FROM" ]

  curl-linux:
    name: curl (${{ matrix.file }} in debian:13)
    runs-on: ${{ matrix.os }}
    container: debian:13
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, file: strypt-0.1.1-x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, file: strypt-0.1.1-aarch64-unknown-linux-musl }
    env: { FILE: "${{ matrix.file }}" }
    defaults: { run: { working-directory: /w } }
    steps:
      - working-directory: /
        run: mkdir /w && apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
      - name: README's download block, with F set from its table
        run: |
          curl -fsSL "$README" -o README.md
          sed -n '/^F=strypt-/,/^```/p' README.md | sed '$d' | sed "1s/^F=[^ ]*/F=$FILE/" > steps.sh
          cat steps.sh && sh -ex steps.sh
      - name: Debian's own gh
        if: always()
        run: |
          apt-get install -y -qq gh >/dev/null && gh --version
          if gh attestation --help >/dev/null 2>&1; then echo "has gh attestation"; else echo "no gh attestation"; fi
      - name: gh from cli.github.com's Debian instructions
        if: always()
        run: |
          mkdir -p -m 755 /etc/apt/keyrings
          curl -fsSLo /etc/apt/keyrings/githubcli-archive-keyring.gpg https://cli.github.com/packages/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
          apt-get update -qq && apt-get install -y -qq gh >/dev/null && gh --version
      - name: README's gh line, signed out, then with a token
        if: always()
        env: { TOKEN: "${{ github.token }}" }
        run: |
          { echo "F=$FILE"; grep -o 'gh attestation verify [^`]*' README.md; } > gh.sh && cat gh.sh
          if sh gh.sh; then echo "signed out: passed"; else echo "signed out: failed"; fi
          GH_TOKEN=$TOKEN sh -e gh.sh
          # Silent on success without a terminal, so print what it verified.
          d=$(GH_TOKEN=$TOKEN gh attestation verify "$FILE" -R FadeHack/strypt --format json --jq '.[].verificationResult.signature.certificate.sourceRepositoryDigest')
          echo "built from $d" && [ "$d" = "$BUILT_FROM" ]

  cargo:
    name: cargo install (debian:13)
    runs-on: ubuntu-24.04
    container: debian:13
    steps:
      - name: Debian's own cargo
        run: |
          apt-get update -qq && apt-get install -y -qq cargo curl >/dev/null && cargo --version
          if cargo install strypt; then echo "Debian's cargo: installed"; else echo "Debian's cargo: failed"; fi
      # rustup.rs's installer; rustup needs a C linker, which Debian's cargo brought in.
      - name: rustup, then README's cargo line
        run: |
          apt-get remove -y -qq cargo rustc >/dev/null && apt-get install -y -qq gcc libc6-dev >/dev/null
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env" && cargo --version
          curl -fsSL "$README" | grep -o 'cargo install strypt' | head -1 > steps.sh
          cat steps.sh && sh -ex steps.sh && strypt --version

  windows:
    name: Get-FileHash (windows-2025)
    runs-on: windows-2025
    defaults: { run: { shell: powershell } }
    env: { TOKEN: "${{ github.token }}" }
    steps:
      # README gives no download command on Windows, so this stands in for a browser.
      - name: Download, then README's Get-FileHash and gh lines
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $readme = (Invoke-WebRequest -UseBasicParsing $env:README).Content
          $F = [regex]::Match($readme, 'Get-FileHash ([^\s`]+)').Groups[1].Value
          $base = [regex]::Match($readme, 'curl -LO (\S+)/\$F').Groups[1].Value
          Invoke-WebRequest -UseBasicParsing "$base/$F" -OutFile $F
          Invoke-WebRequest -UseBasicParsing "$base/SHA256SUMS" -OutFile SHA256SUMS
          Get-FileHash $F | Format-List
          $line = (Select-String -SimpleMatch $F SHA256SUMS).Line; $line
          if ($line -notmatch "^$((Get-FileHash $F).Hash) ") { throw "hash mismatch" }
          & ".\$F" --version; if ($LASTEXITCODE) { throw "--version failed" }
          $gh = [regex]::Match($readme, 'gh attestation verify [^`]+').Value; $gh
          Invoke-Expression $gh; "signed out: exit $LASTEXITCODE"
          $env:GH_TOKEN = $env:TOKEN
          Invoke-Expression $gh; if ($LASTEXITCODE) { throw "gh attestation verify failed" }
          $d = gh attestation verify $F -R FadeHack/strypt --format json --jq '.[].verificationResult.signature.certificate.sourceRepositoryDigest'
          "built from $d"; if ($d -ne $env:BUILT_FROM) { throw "unexpected source commit" }

  tails:
    name: Tails Persistent Storage mount options
    runs-on: ubuntu-24.04
    env:
      V: "7.13"
      SUM: cacb025f452ad010257dd5d3ba7bf7cb1bdfde50e8e583670d604d0bb6336682 # tails.net latest.json
    steps:
      - name: Read them from the Tails ISO
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools libarchive-tools >/dev/null
          curl -fsSLo t.iso "https://download.tails.net/tails/stable/tails-amd64-$V/tails-amd64-$V.iso"
          echo "$SUM  t.iso" | sha256sum -c
          bsdtar -xf t.iso live/filesystem.squashfs && rm t.iso
          unsquashfs -l live/filesystem.squashfs | grep -E '/tps/|udisks2|fstab|\.mount$' | head -80 || true
          sudo unsquashfs -q -d root live/filesystem.squashfs etc usr/lib/python3/dist-packages/tps usr/lib/systemd/system || true
          sudo unsquashfs -q -d root -f live/filesystem.squashfs usr/local usr/lib/live || true
          sudo grep -rnE 'noexec|nosuid|nodev|nosymfollow' root/etc root/usr/lib/systemd/system root/usr/lib/python3/dist-packages/tps || true
          sudo grep -rnIl noexec root/usr/local root/usr/lib/live || echo "no noexec in usr/local or live-boot"
          sudo grep -nE -A4 'def (apply|_bind_mount|_mount)|\["mount"|"mount",' root/usr/lib/python3/dist-packages/tps/configuration/binding.py || true
      # Tails 7's tps/device.py mounts the partition with `-o acl`; tps/configuration/binding.py
      # bind-mounts the Persistent folder, then remounts it `nosymfollow`.
      - name: Mount an image as Tails does, and run the binary from its Persistent folder
        run: |
          T=/live/persistence/TailsData_unlocked P=/home/amnesia/Persistent
          truncate -s 64M tps.img && mkfs.ext4 -q tps.img
          sudo mkdir -p $T $P && sudo mount -o acl tps.img $T
          sudo mkdir $T/Persistent && sudo chown "$USER" $T/Persistent
          sudo mount --bind $T/Persistent $P && sudo mount -o remount,nosymfollow $P
          findmnt -no OPTIONS $T && findmnt -no OPTIONS $P
          curl -fsSLo $P/strypt "https://github.com/FadeHack/strypt/releases/download/v0.1.1/strypt-0.1.1-x86_64-unknown-linux-musl"
          chmod +x $P/strypt && cd $P && ./strypt --version
          echo '<svg xmlns="http://www.w3.org/2000/svg"><metadata>x</metadata></svg>' > t.svg
          ./strypt strip t.svg && ! grep -q metadata t.stripped.svg
