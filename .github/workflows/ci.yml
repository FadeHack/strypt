name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

# No workflow needs write access. A compromised action should not be able to push.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings everywhere, not only in the clippy job.
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      # No toolchain is installed here on purpose: rust-toolchain.toml pins the version and
      # rustup honours it automatically. Installing one would silently override the pin.
      - name: Show pinned toolchain
        run: |
          rustc --version
          cargo --version
      - run: cargo build --all-targets
      - run: cargo test --all-features

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo clippy --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV (ADR-0013)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The deliberate exception to the toolchain pin: this job must build against the
      # declared MSRV, which is the point of having one. Keep in sync with `rust-version`
      # in Cargo.toml — currently 1.95 (current stable minus two, ADR-0013).
      #
      # RUSTUP_TOOLCHAIN is required here, not optional. rustup precedence is:
      #   +toolchain  >  RUSTUP_TOOLCHAIN  >  directory override  >  rust-toolchain.toml
      #     >  rustup default
      # An action that merely sets the *default* toolchain is outranked by
      # rust-toolchain.toml, so this job would silently build with the pinned 1.97.1 and
      # test nothing. Verified locally 2026-08-19. If you change this, re-verify that the
      # job's `rustc --version` step actually reports the MSRV.
      - run: rustup toolchain install 1.95 --profile minimal --no-self-update
      - name: Confirm the MSRV toolchain is actually in use
        run: rustc --version   # must report 1.95.x, not the pinned release
      - run: cargo build --all-features
    env:
      RUSTUP_TOOLCHAIN: "1.95"

  fs-matrix:
    # ADR-0043. Loop mounts need sudo, which GitHub's Ubuntu runners grant without a password.
    name: filesystem-constraints matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq dosfstools exfatprogs
      # The Azure kernel ships exFAT in its extra modules. If the package for this kernel is not in
      # the archive yet (actions/runner-images#8080), this fails: no FUSE fallback, which would test
      # a different driver from the one a Linux user's stick meets.
      - name: Load the exFAT kernel module
        run: |
          uname -r
          sudo modprobe exfat 2>/dev/null \
            || { sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" && sudo modprobe exfat; }
      - run: cargo build -p strypt
      - run: ./scripts/fs-matrix.sh
      - run: ./scripts/prove-fs-matrix.sh

  fuzz-smoke:
    name: fuzz smoke (${{ matrix.target }})
    # Linux only: cargo-fuzz supports x86-64 and aarch64 on Unix-like systems and not Windows
    # at all (verified 2026-08-19). Windows is covered by the other layers.
    runs-on: ubuntu-latest
    # Every target, not just pdf and detect: free on a public repository (ADR-0049). A private
    # repository pays for 22 runners per push.
    strategy:
      fail-fast: false
      matrix:
        target: [bmff, detect, flac, gif, heif, jpeg, jxl, mp3, mp4, odf, ogg, oggpage, ooxml, pdf,
                 png, riff, svg, tags, tiff, wav, webp, zip]
    steps:
      - uses: actions/checkout@v5
      # The deliberate second exception to the toolchain pin, alongside `msrv`: libFuzzer's
      # instrumentation needs nightly. See that job for why RUSTUP_TOOLCHAIN is set rather
      # than relying on a default.
      - run: rustup toolchain install nightly --profile minimal --no-self-update
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # A short run per target, on every push. This will not find a deep bug — the sustained
      # budget is Phase 3's job (ADR-0044) — but it does catch a target that stopped building
      # or an invariant assertion that a change just broke, which is the failure that would
      # otherwise sit unnoticed until someone remembered to fuzz manually.
      # `seeds/` is the committed corpus; `corpus/` is libFuzzer's scratch and is git-ignored,
      # so it has to be created here. libFuzzer writes to the first directory and reads the rest.
      #
      # `--target` is explicit and must stay that way. install-action supplies a musl-built
      # cargo-fuzz, and cargo-fuzz defaults its target to its own build triple — so it tried
      # to build the fuzz binary for x86_64-unknown-linux-musl, where the address sanitizer
      # cannot link against a statically linked libc. The failure reads as a missing `core`
      # crate, which points nowhere near the actual cause.
      - name: Fuzz ${{ matrix.target }}
        working-directory: crates/strypt-core/fuzz
        run: |
          mkdir -p "corpus/$T"
          cargo fuzz run --target x86_64-unknown-linux-gnu "$T" "corpus/$T" "seeds/$T" \
            -- -max_total_time=60 -rss_limit_mb=2048
        env:
          T: ${{ matrix.target }}
      # Any crash, hang, or OOM leaves its input behind. Publishing it makes the finding
      # reproducible by whoever picks it up, rather than a red X with a log that scrolled away.
      - name: Upload any crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: crates/strypt-core/fuzz/artifacts/
    env:
      RUSTUP_TOOLCHAIN: "nightly"
      # Overrides the workflow-level `-D warnings`. cargo-fuzz composes its own RUSTFLAGS and
      # appends this one, which would then apply to every dependency compiled into the fuzz
      # binary — turning a warning in somebody else's crate into a failed gate here. Our own
      # code is still held to -D warnings by the clippy job.
      RUSTFLAGS: ""
