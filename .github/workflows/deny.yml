# Supply-chain policy (ADR-0008). Every check is a hard merge gate from Phase 3 (ADR-0045).
#
# `bans`, `licenses` and `sources` depend only on this repository (ADR-0016). `advisories` also
# depends on RustSec and crates.io, so it can go red with no commit here — a new advisory or a
# yank. That is the gate working: fix it, or add a reasoned `ignore` to deny.toml. Never
# restore `continue-on-error`.

name: cargo-deny

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisories and yanks appear independently of commits, so check on a schedule too.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  policy:
    name: bans, licenses, sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Pinned to match rust-toolchain.toml. The action runs in a musl container that
          # cannot resolve the pinned toolchain otherwise, which emits a rustup error into
          # the log — noise that would help hide a real failure.
          rust-version: "1.97.1"
          command: check bans licenses sources

  advisories:
    name: advisories and yanked crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.97.1"
          command: check advisories

  prove-gates:
    # Plants one violation per check in a copy of the tree and requires each gate to catch it
    # (scripts/prove-gates.sh). A gate weakened in deny.toml or check-no-network.sh fails here.
    name: every gate fails when violated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          # The version cargo-deny-action@v2 bundles as of 2026-09-11, so both jobs agree.
          tool: cargo-deny@0.20.2
      - run: ./scripts/prove-gates.sh
